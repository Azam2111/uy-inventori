<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uy Inventori">
<meta name="theme-color" content="#ffffff">
<title>Uy Inventori</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#000000;--text2:#8E8E93;--border:#E5E5EA;
  --acc:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--purple:#AF52DE;
  --shadow:0 8px 32px rgba(0,0,0,0.08);--shadow-sm:0 2px 8px rgba(0,0,0,0.06);
  --rd:16px;--rs:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1C1C1E;--card:#2C2C2E;--text:#FFFFFF;--text2:#8E8E93;--border:#3A3A3C;
  --shadow:0 8px 32px rgba(0,0,0,0.3);
}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom,16px) + 70px)}
button{cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s}
button:active{opacity:.7;transform:scale(.97)}
input[type=text],input[type=number],input[type=password]{background:var(--bg);border:none;border-radius:var(--rs);padding:14px 16px;width:100%;font-size:16px;color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
::-webkit-scrollbar{display:none}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.su{animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
.spin{animation:spin 1s linear infinite}
.glass{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@media(prefers-color-scheme:dark){.glass{background:rgba(28,28,30,.85)}}

/* ── LAYOUT ── */
#app{max-width:430px;margin:0 auto;min-height:100vh}

/* ── HEADER ── */
.hdr{padding:56px 20px 0;background:transparent;position:sticky;top:0;z-index:20}
.hdr-inner{background:rgba(242,242,247,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:16px 20px 0;margin-bottom:16px;box-shadow:var(--shadow-sm)}
@media(prefers-color-scheme:dark){.hdr-inner{background:rgba(28,28,30,.9)}}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hdr-title{font-size:28px;font-weight:800;letter-spacing:-.5px}
.hdr-sub{font-size:13px;color:var(--text2);font-weight:500;margin-top:2px}
.hdr-sub.sync{color:var(--green)}
.add-fab{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,122,255,.4)}

/* ── TABS ── */
.tabs{display:flex;gap:4px;padding-bottom:0;overflow-x:auto;scrollbar-width:none}
.tab-btn{flex:1;flex-shrink:0;padding:10px 4px 12px;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--text2);background:none;border:none;border-bottom:2.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;position:relative}
.tab-btn i{font-size:20px}
.tab-btn.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab-badge{position:absolute;top:6px;right:50%;margin-right:-18px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}

/* ── CONTENT ── */
.cnt{padding:0 16px;display:flex;flex-direction:column;gap:14px}

/* ── CARD ── */
.card{background:var(--card);border-radius:var(--rd);box-shadow:var(--shadow-sm);overflow:hidden}

/* ── CHIPS (COUNTERS) ── */
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip{padding:14px 8px;border-radius:var(--rd);text-align:center;background:var(--card);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.96)}
.chip .cv{font-size:28px;font-weight:800;color:var(--text)}
.chip .cl{font-size:11px;color:var(--text2);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.chip.active-rd .cv{color:var(--red)}
.chip.active-or .cv{color:var(--orange)}
.chip.active-gn .cv{color:var(--green)}

/* ── PILLS ── */
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.pill{white-space:nowrap;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;border:none;color:var(--text2);background:var(--card);box-shadow:var(--shadow-sm)}
.pill.on{background:var(--text);color:var(--bg)}

/* ── ITEMS ── */
.item-card{background:var(--card);border-radius:var(--rd);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .15s}
.item-row{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.item-icon{width:40px;height:40px;border-radius:var(--rs);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item-icon i{font-size:18px;color:var(--text2)}
.item-body{flex:1;min-width:0}
.item-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12px;color:var(--text2);margin-top:2px;font-weight:500}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.badge.rd{background:rgba(255,59,48,.1);color:var(--red)}
.badge.or{background:rgba(255,149,0,.1);color:var(--orange)}
.badge.gn{background:rgba(52,199,89,.1);color:var(--green)}
.next-btn{font-size:12px;padding:5px 10px;border-radius:8px;border:none;background:var(--bg);color:var(--acc);font-weight:600;display:flex;align-items:center;gap:4px}

/* ── EXPANDED ── */
.item-exp{border-top:1px solid var(--border);padding:14px 16px;background:var(--bg)}
.exp-dates{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:12px;flex-wrap:wrap}
.exp-acts{display:flex;gap:8px}
.act-btn{flex:1;padding:9px;border-radius:var(--rs);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--card);color:var(--text)}
.act-btn.warn{background:rgba(255,149,0,.12);color:var(--orange)}
.act-btn.danger{background:rgba(255,59,48,.1);color:var(--red);flex:0;padding:9px 14px}
.cycle-tag{font-size:11px;color:var(--acc);background:rgba(0,122,255,.08);border-radius:8px;padding:5px 10px;margin-bottom:10px;display:flex;align-items:center;gap:5px;font-weight:600}

/* ── NOTIF ALERTS ── */
.notif-list{display:flex;flex-direction:column;gap:8px}
.notif-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:var(--rd);box-shadow:var(--shadow-sm)}
.notif-card.urgent{background:rgba(255,59,48,.07)}
.notif-card.warn{background:rgba(255,149,0,.07)}
.notif-ico{font-size:22px;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-name{font-weight:700;font-size:15px}
.notif-desc{font-size:12px;color:var(--text2);margin-top:2px}
.notif-cta{padding:7px 14px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:13px;font-weight:600;flex-shrink:0}

/* ── FLASH ── */
.flash{padding:12px 18px;border-radius:var(--rs);font-size:14px;font-weight:600;animation:slideUp .25s ease}
.flash.ok{background:rgba(52,199,89,.12);color:var(--green)}
.flash.err{background:rgba(255,59,48,.1);color:var(--red)}
.flash.info{background:rgba(0,122,255,.1);color:var(--acc)}

/* ── QUICK ADD ── */
.qa-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.qa-pill{flex-shrink:0;padding:9px 16px;border-radius:20px;border:none;background:var(--card);font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:6px}
.qa-pill i{font-size:13px;color:var(--acc)}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--card);border-radius:var(--rd);padding:18px;box-shadow:var(--shadow-sm)}
.stat-card i{font-size:16px;color:var(--text2)}
.stat-num{font-size:28px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px}
.stat-lbl{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.chart-bar{margin-bottom:14px}
.chart-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;font-weight:500}
.chart-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.chart-fill{height:100%;border-radius:3px;background:var(--acc);opacity:.7}
.chart-sub{font-size:11px;color:var(--text2);margin-top:4px}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rank-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff}

/* ── BUDGET ── */
.budget-ring{display:flex;align-items:center;gap:20px;margin-bottom:4px}
.budget-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:12px 0 8px}
.budget-fill{height:100%;border-radius:5px;transition:width .5s ease}
.budget-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);font-weight:500}

/* ── MARKET MODE ── */
.market-item{background:var(--card);border-radius:var(--rd);box-shadow:var(--shadow-sm);padding:18px;display:flex;align-items:center;gap:14px;transition:opacity .3s}
.market-item.done-item{opacity:.45}
.market-check{width:52px;height:52px;border-radius:26px;border:2.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;color:#fff;transition:all .25s}
.market-check.done{border-color:var(--green);background:var(--green)}
.market-info{flex:1;min-width:0}
.market-name{font-size:20px;font-weight:700}
.market-meta{font-size:13px;color:var(--text2);margin-top:4px}
.market-total{background:var(--card);border-radius:var(--rd);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm)}
.market-finish{width:100%;padding:16px;border-radius:var(--rd);border:none;background:var(--green);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(52,199,89,.35)}

/* ── ADD FORM ── */
.form-wrap{background:var(--card);border-radius:var(--rd);padding:20px;box-shadow:var(--shadow-sm)}
.form-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.form-title{font-size:20px;font-weight:800}
.close-btn{width:32px;height:32px;border-radius:16px;background:var(--bg);border:none;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl-lbl{font-size:12px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding-left:4px}
.input-box{background:var(--bg);border-radius:var(--rs)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:240px;overflow-y:auto}
.cat-btn{padding:10px 12px;border-radius:var(--rs);border:2px solid transparent;background:var(--bg);font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.cat-btn.on{border-color:var(--acc);background:rgba(0,122,255,.06)}
.cat-btn i{font-size:16px;color:var(--text2)}
.cat-btn.on i{color:var(--acc)}
.status-row{display:flex;gap:8px}
.st-btn{flex:1;padding:10px 4px;border-radius:var(--rs);border:2px solid transparent;background:var(--bg);font-size:12px;font-weight:600;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:5px}
.st-btn i{font-size:18px}
.st-btn.on{border-color:var(--acc);color:var(--acc);background:rgba(0,122,255,.06)}
.save-btn{width:100%;padding:15px;border-radius:var(--rd);border:none;background:var(--acc);color:#fff;font-size:17px;font-weight:700;margin-top:8px;box-shadow:0 4px 14px rgba(0,122,255,.35)}
.save-btn:disabled{background:var(--text2);box-shadow:none}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:var(--rs);margin-top:6px;z-index:100;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ac-item{padding:12px 16px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text)}

/* ── AI CONFIRM ── */
.ai-confirm{background:rgba(255,149,0,.08);border:1.5px solid rgba(255,149,0,.25);border-radius:var(--rs);padding:16px;margin-bottom:16px}
.ai-confirm-q{font-weight:700;font-size:15px;margin-bottom:12px}
.ai-confirm-acts{display:flex;gap:8px}
.ai-yes{flex:1;padding:10px;border-radius:var(--rs);border:none;background:var(--orange);color:#fff;font-weight:700;font-size:13px}
.ai-no{flex:1;padding:10px;border-radius:var(--rs);border:1.5px solid rgba(255,149,0,.4);background:none;color:var(--orange);font-weight:700;font-size:13px}

/* ── AI TAB ── */
.ai-section{background:var(--card);border-radius:var(--rd);padding:20px;box-shadow:var(--shadow-sm)}
.ai-section-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ai-action{width:100%;padding:13px;border-radius:var(--rs);border:none;background:var(--bg);font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.ai-result{font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap;background:var(--bg);border-radius:var(--rs);padding:14px;margin-top:8px}
.key-form{display:flex;flex-direction:column;gap:10px}

/* ── SCAN ── */
.scan-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-radius:var(--rs);margin-bottom:8px}
.scan-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s}
.scan-check.on{border-color:var(--green);background:var(--green)}
.scan-info{flex:1;min-width:0}
.scan-name{font-size:14px;font-weight:600}
.scan-meta{font-size:11px;color:var(--text2);margin-top:2px}
.scan-add{width:100%;padding:13px;border-radius:var(--rs);border:none;background:var(--green);color:#fff;font-size:15px;font-weight:700;margin-top:8px;box-shadow:0 4px 14px rgba(52,199,89,.3)}
.group-toggle{display:flex;background:var(--bg);border-radius:var(--rs);padding:4px;margin-bottom:12px}
.group-opt{flex:1;padding:8px;border-radius:10px;border:none;font-size:13px;font-weight:600;color:var(--text2);background:none}
.group-opt.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow-sm)}

/* ── CURRENCY ── */
.cur-pills{display:flex;gap:8px;flex-wrap:wrap}
.cur-pill{padding:9px 18px;border-radius:20px;font-size:14px;font-weight:600;border:2px solid transparent;background:var(--bg);color:var(--text2)}
.cur-pill.on{border-color:var(--acc);color:var(--acc);background:rgba(0,122,255,.06)}

/* ── SETUP ── */
.setup-wrap{padding:40px 24px;text-align:center}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
.empty-state i{font-size:48px;display:block;margin-bottom:14px;opacity:.4}
.empty-state p{font-size:15px;font-weight:500}
.empty-cta{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:12px 24px;border-radius:var(--rd);border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="cam-inp" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal-inp" accept="image/*" style="display:none">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDF9MoYhkiftBOSxcZ_4A2VVAQxx6lIzrY",
  authDomain:"uy-inventori.firebaseapp.com",
  databaseURL:"https://uy-inventori-default-rtdb.firebaseio.com",
  projectId:"uy-inventori",
  storageBucket:"uy-inventori.firebasestorage.app",
  messagingSenderId:"184996111777",
  appId:"1:184996111777:web:109dd2394efd370bfcd7e0"
};
function getApiKey(){return localStorage.getItem('claude_api_key')||'';}
function setApiKey(k){localStorage.setItem('claude_api_key',k.trim());}
const CONFIGURED=FIREBASE_CONFIG.apiKey!=='YOUR_API_KEY';

// ── CATEGORIES ──
const CATS={
  food:     {l:'Oziq-ovqat',  i:'ti-apple',          essential:true },
  hygiene:  {l:'Gigiyena',    i:'ti-droplet',         essential:true },
  household:{l:'Maishiy',     i:'ti-home',            essential:true },
  medicine: {l:'Dori-darmon', i:'ti-first-aid-kit',   essential:true },
  kids:     {l:'Bola uchun',  i:'ti-baby-carriage',   essential:true },
  food_out: {l:'Tashqarida',  i:'ti-tools-kitchen',   essential:false},
  taxi:     {l:'Taxi/Avtobus',i:'ti-car',             essential:false},
  sport:    {l:'Sport',       i:'ti-barbell',         essential:false},
  education:{l:"Ta'lim",      i:'ti-school',          essential:false},
  leisure:  {l:'Dam olish',   i:'ti-beach',           essential:false},
  other:    {l:'Boshqa',      i:'ti-package',         essential:false},
};
const SC={
  need_to_buy:{lbl:'Kerak',   cls:'rd', nl:'Savatga', ni:'ti-shopping-cart', ns:'in_cart'},
  in_cart:    {lbl:'Savatda', cls:'or', nl:'Olindi',  ni:'ti-circle-check',  ns:'bought' },
  bought:     {lbl:'Olindi',  cls:'gn', nl:null,      ni:null,               ns:null     },
};
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const CURRENCIES=['EGP','UZS','USD','EUR','AED','RUB'];
const CUR_SYM={EGP:'EGP',UZS:"so'm",USD:'$',EUR:'€',AED:'AED',RUB:'₽'};

// ── UTILS ──
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const td=()=>new Date().toISOString();
const curYM=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const mLbl=s=>{const[y,m]=s.split('-');return `${MONTHS[+m-1]} ${y}`;};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const fmt=d=>new Date(d).toLocaleDateString('ru-RU');

function fmtP(p,currency){
  if(p==null||p==='') return null;
  const cur=currency||(state.settings.defaultCurrency)||'EGP';
  const sym=CUR_SYM[cur]||cur;
  if(cur==='USD') return '$'+Number(p).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return Number(p).toLocaleString('ru-RU')+' '+sym;
}

// ── STATE ──
let db=null,dbRef=null;
let state={
  items:[],settings:{budget:null,defaultCurrency:'EGP'},
  tab:'list',filter:'all',open:null,
  editItem:null,
  form:{name:'',category:'food',price:'',currency:'EGP',status:'need_to_buy'},
  flash:null,synced:false,loaded:!CONFIGURED,
  acSuggestions:[],aiChecking:false,aiConfirm:null,
  aiAnalysis:null,aiAnalysisLoading:false,
  scanLoading:false,scanItems:null,scanSelected:[],scanGrouped:true,
  smartNotifs:[],
  showBudgetEdit:false,budgetInput:'',
  showKeySetup:!localStorage.getItem('claude_api_key'),keyInput:'',
  marketDone:[],
};
let flashTimer=null;
const app=$('app');

function upd(o,noRender){Object.assign(state,o);if(!noRender)render();}
function notify(msg,type){clearTimeout(flashTimer);upd({flash:{msg,type:type||'ok'}});flashTimer=setTimeout(()=>upd({flash:null}),2800);}

// ── SMART NOTIFS (only essential categories, min 2 purchases) ──
const JUNK_WORDS = ['chips','muzqaymoq','shokolad','pivo','cola','pepsi','fanta','konfet','shirinlik','biskvit','tort','kfc','burger','pizza','lavash','hotdog','marmelad','saqich'];
function isEssential(item){
  if(!CATS[item.category]?.essential) return false;
  const name = item.name.toLowerCase();
  if(JUNK_WORDS.some(w=>name.includes(w))) return false;
  return true;
}

function calculateCycle(name){
  const bought=state.items
    .filter(i=>i.name.toLowerCase()===name.toLowerCase()&&i.status==='bought'&&i.purchaseDate)
    .sort((a,b)=>new Date(a.purchaseDate)-new Date(b.purchaseDate));
  if(bought.length<2)return null; // min 2 purchases required
  let total=0;
  for(let i=1;i<bought.length;i++)
    total+=(new Date(bought[i].purchaseDate)-new Date(bought[i-1].purchaseDate))/86400000;
  return Math.round(total/(bought.length-1));
}

function checkSmartNotifs(items){
  // Only essential categories get reminders
  const essentialItems=items.filter(i=>i.status==='bought'&&isEssential(i));
  const names=[...new Set(essentialItems.map(i=>i.name))];
  const notifs=[];
  names.forEach(name=>{
    const cycle=calculateCycle(name);
    if(!cycle)return; // needs at least 2 purchases
    const lastBought=items.filter(i=>i.name===name&&i.status==='bought'&&i.purchaseDate)
      .sort((a,b)=>new Date(b.purchaseDate)-new Date(a.purchaseDate))[0];
    if(!lastBought)return;
    const daysSince=Math.round((Date.now()-new Date(lastBought.purchaseDate))/86400000);
    const alreadyActive=items.some(i=>i.name===name&&(i.status==='need_to_buy'||i.status==='in_cart'));
    // Only notify at 100% of cycle (not 75%)
    if(daysSince>=cycle&&!alreadyActive){
      notifs.push({name,daysSince,cycle,urgent:daysSince>=Math.round(cycle*1.2)});
    }
  });
  upd({smartNotifs:notifs.sort((a,b)=>b.daysSince-a.daysSince)},true);
}

// ── AUTOCOMPLETE ──
function getAcSuggestions(val){
  if(!val||val.length<2)return[];
  const q=val.toLowerCase();
  return[...new Set(state.items.map(i=>i.name))].filter(n=>n.toLowerCase().includes(q)&&n.toLowerCase()!==q).slice(0,5);
}

// ── QUICK ADD (most bought items) ──
function getQuickItems(){
  const freq={};
  state.items.filter(i=>i.status==='bought'&&isEssential(i)).forEach(i=>{freq[i.name]=(freq[i.name]||0)+1;});
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([name,count])=>({name,count}));
}

function quickAdd(name){
  const exists=state.items.some(i=>i.name===name&&(i.status==='need_to_buy'||i.status==='in_cart'));
  if(exists){notify(`"${name}" allaqachon ro'yxatda`,'info');return;}
  const last=state.items.filter(i=>i.name===name&&i.status==='bought').sort((a,b)=>new Date(b.purchaseDate)-new Date(a.purchaseDate))[0];
  persist([{id:uid(),name,category:last?.category||'food',price:last?.price||null,currency:last?.currency||state.settings.defaultCurrency||'EGP',status:'need_to_buy',dateAdded:td(),purchaseDate:null,month:curYM()},...state.items]);
  notify(`"${name}" ro'yxatga qo'shildi`);
}

// ── BUDGET ──
function getBudgetStatus(){
  const{budget}=state.settings;if(!budget)return null;
  const cur=state.settings.defaultCurrency||'EGP';
  const spent=state.items.filter(i=>i.status==='bought'&&i.month===curYM()&&i.price&&(i.currency||'EGP')===cur).reduce((s,i)=>s+i.price,0);
  const pct=Math.round((spent/budget)*100);
  return{budget,spent,pct,cur,color:pct>=90?'var(--red)':pct>=70?'var(--orange)':'var(--green)'};
}

// ── AI NORMALIZE ──
async function aiNormalize(typedName){
  if(!getApiKey())return null;
  const existingNames=[...new Set(state.items.map(i=>i.name))];
  if(!existingNames.length)return null;
  if(existingNames.some(n=>n.toLowerCase()===typedName.toLowerCase()))return null;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:30,
        messages:[{role:'user',content:`"${typedName}" va quyidagi ro'yxatdagi qaysi biri bir xil mahsulot?: ${existingNames.map(n=>`"${n}"`).join(', ')}. Faqat o'sha nomni yaz, yoki "null".`}]})
    });
    const data=await res.json();
    const answer=data.content?.[0]?.text?.trim();
    if(!answer||answer==='null')return null;
    return existingNames.find(n=>n.toLowerCase()===answer.toLowerCase())||null;
  }catch(e){return null;}
}

// ── AI ANALYZE ──
async function aiAnalyze(){
  if(!getApiKey()){notify('Claude API key sozlanmagan','err');return;}
  upd({aiAnalysisLoading:true,aiAnalysis:null});
  const bought=state.items.filter(i=>i.status==='bought');
  if(bought.length<5){upd({aiAnalysisLoading:false,aiAnalysis:"Hali yetarli ma'lumot yo'q. Kamida 5 ta mahsulot sotib olinsin."});return;}
  const byMonth={};
  bought.forEach(i=>{const m=i.month||curYM();if(!byMonth[m]){byMonth[m]={total:0,count:0};}byMonth[m].total+=i.price||0;byMonth[m].count++;});
  const freq={};bought.forEach(i=>{freq[i.name]=(freq[i.name]||0)+1;});
  const top5=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,
        messages:[{role:'user',content:`Uy xarajatlari ma'lumotlari asosida o'zbek tilida qisqa va amaliy tavsiya ber:\nOylik xarajatlar: ${JSON.stringify(byMonth)}\nEng ko'p olinadigan: ${top5.map(([n,c])=>`${n}(${c}x)`).join(', ')}\nJami: ${bought.length} ta\nByudjet: ${state.settings.budget?fmtP(state.settings.budget):'belgilanmagan'}\n3-4 paragrafda: tendensiya, ko'p xarajat, iqtisod maslahat. Sodda yoz.`}]})
    });
    const data=await res.json();
    upd({aiAnalysis:data.content?.[0]?.text?.trim()||'Tahlil qilishda xato'});
  }catch(e){upd({aiAnalysis:'Internet xatosi. Qayta urinib ko\'ring.'});}
  upd({aiAnalysisLoading:false});
}

// ── RECEIPT SCAN ──
async function scanReceipt(base64,mediaType){
  if(!getApiKey()){notify('Claude API key sozlanmagan','err');return;}
  upd({scanLoading:true,scanItems:null,scanSelected:[]});
  try{
    const today=new Date().toISOString().slice(0,10);
    const defCur=state.settings.defaultCurrency||'EGP';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mediaType,data:base64}},
          {type:'text',text:`Bu rasm chek yoki buyurtma. Qoidalar:
1. delivery fee, service fee, tax, subtotal, total OLMAYDI
2. Har bir mahsulot uchun:
   - name: qisqa o'zbek nomi (1-3 so'z)
   - price: narxi (raqam, yo'q bo'lsa null)
   - currency: ${defCur} (ko'rinmasa default)
   - date: ${today}
   - category: food/food_out/taxi/hygiene/household/medicine/sport/education/leisure/kids/other
   - is_delivery: true (agar bu restoran/dostavka/kafe buyurtmasi bo'lsa), false (do'kon cheki)

JSON array: [{"name":"Tovuq","price":150,"currency":"${defCur}","date":"${today}","category":"food","is_delivery":false}]`}
        ]}]})
    });
    const data=await res.json();
    if(data.error){notify('AI xatosi: '+data.error.message,'err');upd({scanLoading:false});return;}
    const text=data.content?.[0]?.text?.trim()||'';
    let parsed=[];
    try{parsed=JSON.parse(text.replace(/```json|```/g,'').trim());}
    catch(e1){try{const m=text.match(/\[\s*\{[\s\S]*?\}\s*\]/);if(m)parsed=JSON.parse(m[0]);}catch(e2){}}
    const validCats=['food','food_out','taxi','hygiene','household','medicine','sport','education','leisure','kids','other'];
    const items=Array.isArray(parsed)?parsed.filter(i=>i&&i.name).map(i=>({
      name:String(i.name||'').trim(),
      price:i.price!=null&&i.price!==''?Number(i.price):null,
      currency:i.currency||defCur,
      date:i.date&&/\d{4}-\d{2}-\d{2}/.test(i.date)?i.date:today,
      category:validCats.includes(i.category)?i.category:'food',
      is_delivery:!!i.is_delivery,
    })).filter(i=>i.name.length>1):[];
    if(!items.length){notify('Mahsulot topilmadi. Rasmni aniqroq qiling','err');upd({scanLoading:false});return;}
    // Auto-detect if delivery
    const isDelivery=items.some(i=>i.is_delivery||i.category==='food_out');
    upd({scanItems:items,scanSelected:items.map((_,i)=>i),scanLoading:false,scanGrouped:isDelivery});
  }catch(e){notify("Chekni o'qib bo'lmadi",'err');upd({scanLoading:false});}
}

function handleSave(){
  const{form,editItem,aiConfirm}=state;
  if(!form.name.trim()){notify('Nom kiriting!','err');return;}
  const nameToSave=aiConfirm?.confirmed||form.name.trim();
  const p=form.price!==''?+form.price:null;
  let next;
  if(editItem){
    next=state.items.map(i=>i.id!==editItem.id?i:{
      ...i,name:nameToSave,category:form.category,price:p,currency:form.currency,status:form.status,
      purchaseDate:form.status==='bought'&&i.status!=='bought'?td():i.purchaseDate,
      month:form.status==='bought'&&i.status!=='bought'?curYM():i.month,
    });
    notify('Yangilandi');
  }else{
    const now=td();
    next=[{id:uid(),name:nameToSave,category:form.category,price:p,currency:form.currency,status:form.status,
      dateAdded:now,purchaseDate:form.status==='bought'?now:null,month:curYM()},...state.items];
    notify("Qo'shildi");
  }
  persist(next);
  checkSmartNotifs(next);
  upd({tab:'list',editItem:null,aiConfirm:null,aiChecking:false,acSuggestions:[],form:{name:'',category:'food',price:'',currency:state.settings.defaultCurrency||'EGP',status:'need_to_buy'}});
}

async function trySave(){
  const{form,editItem,aiChecking}=state;
  if(!form.name.trim()){notify('Nom kiriting!','err');return;}
  if(aiChecking)return;
  if(!editItem&&getApiKey()){
    upd({aiChecking:true,acSuggestions:[]});
    const match=await aiNormalize(form.name.trim());
    upd({aiChecking:false});
    if(match&&match!==form.name.trim()){upd({aiConfirm:{typed:form.name.trim(),suggested:match,confirmed:null}});return;}
  }
  handleSave();
}

function addScanItems(){
  const{scanItems,scanSelected,scanGrouped}=state;
  if(!scanItems)return;
  const toAdd=scanSelected.map(i=>scanItems[i]).filter(Boolean);
  const defCur=state.settings.defaultCurrency||'EGP';
  let newItems;
  if(scanGrouped){
    // Group as single entry
    const total=toAdd.reduce((s,i)=>s+(i.price||0),0);
    const label=toAdd[0]?.category==='food_out'?'Restoran buyurtmasi':'Umumiy xarajat';
    const purchaseDate=new Date(toAdd[0].date+'T12:00:00').toISOString();
    newItems=[{id:uid(),name:label,category:toAdd[0]?.category||'food_out',price:total||null,
      currency:toAdd[0]?.currency||defCur,status:'bought',dateAdded:purchaseDate,purchaseDate,month:toAdd[0].date.slice(0,7)}];
  }else{
    newItems=toAdd.map(item=>{
      const purchaseDate=new Date(item.date+'T12:00:00').toISOString();
      return{id:uid(),name:item.name,category:item.category||'food',price:item.price!=null?item.price:null,
        currency:item.currency||defCur,status:'bought',dateAdded:purchaseDate,purchaseDate,month:item.date.slice(0,7)};
    });
  }
  persist([...newItems,...state.items]);
  notify(`${scanGrouped?'1':''+newItems.length} ta yozuv kiritildi`);
  upd({scanItems:null,scanSelected:[],tab:'list'});
}

function finishMarket(){
  const{marketDone}=state;
  if(!marketDone.length)return;
  const now=td();
  const next=state.items.map(i=>{
    if(!marketDone.includes(i.id))return i;
    return{...i,status:'bought',purchaseDate:now,month:curYM()};
  });
  persist(next);
  checkSmartNotifs(next);
  upd({marketDone:[],tab:'list'});
  notify(`${marketDone.length} ta mahsulot olindi ✅`);
}

function saveBudget(){
  const b=+state.budgetInput;if(!b||b<0){notify('To\'g\'ri miqdor kiriting','err');return;}
  const ns={...state.settings,budget:b};persist(state.items,ns);
  upd({showBudgetEdit:false,budgetInput:''});notify('Byudjet saqlandi');
}

function handleImageFile(file){
  if(!file)return;
  upd({tab:'ai',scanLoading:true,scanItems:null,scanSelected:[]});
  const img=new Image();const objUrl=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(objUrl);
    const MAX=1200;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    scanReceipt(canvas.toDataURL('image/jpeg',.85).split(',')[1],'image/jpeg');
  };
  img.onerror=()=>{notify("Rasmni o'qib bo'lmadi",'err');upd({scanLoading:false});};
  img.src=objUrl;
}
$('cam-inp').addEventListener('change',e=>{handleImageFile(e.target.files[0]);e.target.value='';});

        <button class="tab-btn${tab==='ai'?' on':''}" data-a="tab" data-v="ai">
          <i class="ti ti-robot"></i>AI
        </button>
      </div>
    </div>
  </div>
  <div class="cnt" style="padding-top:14px">
  ${flash?`<div class="flash ${flash.type}">${esc(flash.msg)}</div>`:''} `;

  // ══════════ LIST ══════════
  if(tab==='list'){
    h+=`<div class="chips su">
      <div class="chip${filter==='need_to_buy'?' active-rd':''}" data-a="filter" data-v="${filter==='need_to_buy'?'all':'need_to_buy'}">
        <div class="cv">${cnt.need_to_buy}</div><div class="cl">Kerak</div>
      </div>
      <div class="chip${filter==='in_cart'?' active-or':''}" data-a="filter" data-v="${filter==='in_cart'?'all':'in_cart'}">
        <div class="cv">${cnt.in_cart}</div><div class="cl">Savatda</div>
      </div>
      <div class="chip${filter==='bought'?' active-gn':''}" data-a="filter" data-v="${filter==='bought'?'all':'bought'}">
        <div class="cv">${cnt.bought}</div><div class="cl">Olindi</div>
      </div>
    </div>`;

    // Smart notifs (only essential items)
    if(smartNotifs.length){
      h+=`<div class="notif-list su">`;
      smartNotifs.slice(0,3).forEach(n=>{
        h+=`<div class="notif-card ${n.urgent?'urgent':'warn'}">
          <span class="notif-ico">${n.urgent?'🔴':'🟡'}</span>
          <div class="notif-body">
            <div class="notif-name">${esc(n.name)}</div>
            <div class="notif-desc">${n.daysSince} kun oldin olindi · ~${n.cycle} kunda olinadi</div>
          </div>
          <button class="notif-cta" data-a="notif-add" data-v="${esc(n.name)}">+ Qo'sh</button>
        </div>`;
      });
      h+=`</div>`;
    }

    // Quick add (essential only)
    const quick=getQuickItems();
    if(quick.length){
      h+=`<div class="su"><div style="font-size:12px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-left:4px">Tez qo'shish</div>
        <div class="qa-scroll">${quick.map(q=>`<button class="qa-pill" data-a="quick-add" data-v="${esc(q.name)}"><i class="ti ti-plus"></i>${esc(q.name)}</button>`).join('')}</div>
      </div>`;
    }

    // Quick expense
    h+=`<button class="act-btn su" style="border:none;background:var(--card);box-shadow:var(--shadow-sm);border-radius:var(--rd);width:100%;padding:13px;font-size:14px" data-a="add-expense">
      <i class="ti ti-receipt" style="font-size:15px;color:var(--acc)"></i> Tez xarajat qo'shish (taxi, ovqat...)
    </button>`;

    // Filter pills
    h+=`<div class="pills su">
      <button class="pill${filter==='all'?' on':''}" data-a="filter" data-v="all">Hammasi (${items.length})</button>
      <button class="pill${filter==='need_to_buy'?' on':''}" data-a="filter" data-v="need_to_buy">Kerak (${cnt.need_to_buy})</button>
      <button class="pill${filter==='in_cart'?' on':''}" data-a="filter" data-v="in_cart">Savatda (${cnt.in_cart})</button>
      <button class="pill${filter==='bought'?' on':''}" data-a="filter" data-v="bought">Olindi (${cnt.bought})</button>
    </div>`;

    if(!shown.length){
      h+=`<div class="empty-state su"><i class="ti ti-clipboard-list"></i><p>Hali mahsulot yo'q</p><button class="empty-cta" data-a="add"><i class="ti ti-plus"></i>Birinchisini qo'shish</button></div>`;
    }else{
      h+=`<div class="su" style="display:flex;flex-direction:column;gap:10px">`;
      shown.forEach(item=>{
        const sc=SC[item.status],cat=CATS[item.category]||CATS.other,isOpen=open===item.id;
        const cycle=calculateCycle(item.name);
        h+=`<div class="item-card">
          <div class="item-row" data-a="toggle" data-v="${item.id}">
            <div class="item-icon"><i class="ti ${cat.i}"></i></div>
            <div class="item-body">
              <div class="item-name">${esc(item.name)}</div>
              <div class="item-sub">${esc(cat.l)}${item.price!=null?' · '+esc(fmtP(item.price,item.currency)):''}</div>
            </div>
            <div class="item-right">
              <span class="badge ${sc.cls}">${sc.lbl}</span>
              ${sc.ns?`<button class="next-btn" data-a="advance" data-v="${item.id}"><i class="ti ${sc.ni}" style="font-size:12px"></i>${sc.nl}</button>`:''}
            </div>
          </div>
          ${isOpen?`<div class="item-exp">
            ${cycle&&item.status==='bought'&&CATS[item.category]?.essential?`<div class="cycle-tag"><i class="ti ti-refresh" style="font-size:12px"></i>Odatda har ${cycle} kunda olinadi</div>`:''}
            <div class="exp-dates">
              ${item.dateAdded?`<span><i class="ti ti-calendar" style="font-size:11px"></i> ${fmt(item.dateAdded)}</span>`:''}
              ${item.purchaseDate?`<span><i class="ti ti-check" style="font-size:11px"></i> ${fmt(item.purchaseDate)}</span>`:''}
            </div>
            <div class="exp-acts">
              <button class="act-btn" data-a="edit" data-v="${item.id}"><i class="ti ti-edit" style="font-size:14px"></i>Tahrirlash</button>
              ${item.status!=='need_to_buy'?`<button class="act-btn warn" data-a="reset" data-v="${item.id}"><i class="ti ti-refresh" style="font-size:14px"></i>Qayta</button>`:''}
              <button class="act-btn danger" data-a="remove" data-v="${item.id}"><i class="ti ti-trash" style="font-size:14px"></i></button>
            </div>
          </div>`:''}
        </div>`;
      });
      h+=`</div>`;
    }
  }

  // ══════════ MARKET MODE ══════════
  if(tab==='market'){
    h+=`<div class="su">`;
    if(!needList.length){
      h+=`<div class="empty-state"><i class="ti ti-check"></i><p>Ro'yxat bo'sh — hammasi olindi!</p></div>`;
    }else{
      h+=`<div style="font-size:13px;color:var(--text2);font-weight:600;margin-bottom:8px;padding-left:4px">Bozorda keraklilarni belgilang ✓</div>`;
      h+=`<div style="display:flex;flex-direction:column;gap:10px">`;
      needList.forEach(item=>{
        const done=marketDone.includes(item.id);
        const cat=CATS[item.category]||CATS.other;
        h+=`<div class="market-item${done?' done-item':''}">
          <button class="market-check${done?' done':''}" data-a="market-toggle" data-v="${item.id}">
            ${done?'<i class="ti ti-check" style="font-size:22px"></i>':''}
          </button>
          <div class="market-info">
            <div class="market-name">${esc(item.name)}</div>
            <div class="market-meta">${esc(cat.l)}${item.price!=null?' · '+esc(fmtP(item.price,item.currency)):''}</div>
          </div>
        </div>`;
      });
      h+=`</div>`;
      if(marketDone.length){
        h+=`<button class="market-finish" data-a="market-finish" style="margin-top:16px">
          <i class="ti ti-circle-check" style="font-size:18px"></i> ${marketDone.length} ta mahsulotni "Olindi"ga o'tkazish
        </button>`;
      }
    }
    // Also show in_cart
    const inCart=items.filter(i=>i.status==='in_cart');
    if(inCart.length){
      const shopTotal=inCart.reduce((s,i)=>s+(i.price||0),0);
      h+=`<div style="margin-top:20px">
        <div style="font-size:12px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Savatda</div>
        <div class="market-total"><span style="font-size:14px;color:var(--text2);font-weight:500">Taxminiy jami</span><span style="font-size:22px;font-weight:800">${shopTotal?fmtP(shopTotal):'—'}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${inCart.map(item=>`<div class="market-item">
          <button class="market-check done" data-a="advance" data-v="${item.id}"><i class="ti ti-check" style="font-size:22px"></i></button>
          <div class="market-info">
            <div class="market-name">${esc(item.name)}</div>
            <div class="market-meta">${item.price!=null?esc(fmtP(item.price,item.currency)):'Narx kiritilmagan'}</div>
          </div>
        </div>`).join('')}
        </div>
      </div>`;
    }
    h+=`</div>`;
  }

  // ══════════ STATS ══════════
  if(tab==='stats'){
    const bought=items.filter(i=>i.status==='bought');
    const byM={};bought.forEach(i=>{const m=i.month||curYM();if(!byM[m]){byM[m]={t:0,c:0};}byM[m].t+=i.price||0;byM[m].c++;});
    const mArr=Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
    const maxT=Math.max(...mArr.map(([,v])=>v.t),1);
    const freq={};bought.forEach(i=>{freq[i.name]=(freq[i.name]||0)+1;});
    const top5=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const tD=byM[curYM()]||{t:0,c:0};
    const defCur=state.settings.defaultCurrency||'EGP';

    // Budget section
    h+=`<div class="card su" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <div>
          <div style="font-size:12px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Bu oy — ${mLbl(curYM())}</div>
          <div style="font-size:36px;font-weight:800;margin-top:6px;letter-spacing:-.5px">${fmtP(tD.t,defCur)||'—'}</div>
          <div style="font-size:13px;color:var(--text2);font-weight:500;margin-top:4px">${tD.c} ta mahsulot</div>
        </div>
        <button style="padding:9px 14px;border-radius:var(--rs);border:none;background:var(--bg);font-size:13px;font-weight:600;color:var(--acc)" data-a="budget-edit"><i class="ti ti-target" style="font-size:14px"></i> Byudjet</button>
      </div>`;
    if(budgetSt){
      h+=`<div class="budget-bar"><div class="budget-fill" style="width:${Math.min(budgetSt.pct,100)}%;background:${budgetSt.color}"></div></div>
      <div class="budget-footer"><span>${fmtP(budgetSt.spent,budgetSt.cur)} sarflandi</span><span>${budgetSt.pct}% / ${fmtP(budgetSt.budget,budgetSt.cur)}</span></div>
      <button data-a="budget-clear" style="margin-top:10px;font-size:12px;color:var(--red);background:none;border:none;padding:0;font-weight:600">Byudjetni o'chirish</button>`;
    }
    if(showBudgetEdit){
      h+=`<div style="display:flex;gap:10px;margin-top:14px">
        <input id="binp" type="text" inputmode="numeric" placeholder="500000" value="${esc(state.budgetInput)}" style="flex:1">
        <button class="save-btn" style="flex:0;padding:0 20px;margin-top:0;border-radius:var(--rs)" data-a="budget-save">Saqlash</button>
      </div>`;
    }
    h+=`</div>`;

    h+=`<div class="stat-grid su">
      <div class="stat-card"><i class="ti ti-package"></i><div class="stat-num">${items.length}</div><div class="stat-lbl">Jami</div></div>
      <div class="stat-card"><i class="ti ti-clock"></i><div class="stat-num">${cnt.need_to_buy}</div><div class="stat-lbl">Kerak</div></div>
      <div class="stat-card"><i class="ti ti-shopping-cart"></i><div class="stat-num">${cnt.in_cart}</div><div class="stat-lbl">Savatda</div></div>
      <div class="stat-card"><i class="ti ti-circle-check"></i><div class="stat-num">${cnt.bought}</div><div class="stat-lbl">Olindi</div></div>
    </div>`;

    if(mArr.length){
      h+=`<div class="card su" style="padding:20px"><div style="font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px"><i class="ti ti-chart-bar" style="font-size:16px;color:var(--acc)"></i>Oylik xarajat</div>`;
      mArr.forEach(([m,d])=>{
        h+=`<div class="chart-bar">
          <div class="chart-row"><span style="color:var(--text2)">${mLbl(m)}</span><span style="font-weight:700">${d.t>0?fmtP(d.t,defCur):'—'}</span></div>
          <div class="chart-track"><div class="chart-fill" style="width:${Math.round((d.t/maxT)*100)}%"></div></div>
          <div class="chart-sub">${d.c} ta mahsulot</div>
        </div>`;
      });
      h+=`</div>`;
    }
    if(top5.length){
      h+=`<div class="card su" style="padding:20px"><div style="font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px"><i class="ti ti-award" style="font-size:16px;color:var(--orange)"></i>Ko'p olinadigan</div>`;
      top5.forEach(([name,count],i)=>{
        const colors=['#F59E0B','#9CA3AF','#CD7C2F','var(--text2)','var(--text2)'];
        h+=`<div class="top-row"><div class="rank-dot" style="background:${colors[i]}">${i+1}</div><span style="flex:1;font-size:15px;font-weight:600">${esc(name)}</span><span style="font-size:12px;padding:3px 10px;border-radius:20px;background:var(--bg);color:var(--text2);font-weight:700">${count}x</span></div>`;
      });
      h+=`</div>`;
    }
    if(!bought.length){h+=`<div class="empty-state su"><i class="ti ti-chart-bar"></i><p>Hali statistika yo'q</p></div>`;}
  }

  // ══════════ AI ══════════
  if(tab==='ai'){
    const defCur=state.settings.defaultCurrency||'EGP';
    h+=`<div class="ai-section su">
      <div class="ai-section-title"><i class="ti ti-coin" style="color:var(--orange)"></i>Asosiy valyuta</div>
      <div class="cur-pills">${CURRENCIES.map(c=>`<button class="cur-pill${defCur===c?' on':''}" data-a="set-currency" data-v="${c}">${c}</button>`).join('')}</div>
    </div>`;

    if(state.showKeySetup||!getApiKey()){
      h+=`<div class="ai-section su" style="border:1.5px solid rgba(255,149,0,.25);background:rgba(255,149,0,.06)">
        <div class="ai-section-title" style="color:var(--orange)"><i class="ti ti-key"></i>Claude API Key</div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:12px"><a href="https://console.anthropic.com" target="_blank" style="color:var(--acc)">console.anthropic.com</a> → API Keys → Create Key</p>
        <div class="key-form">
          <input id="key-inp" type="password" placeholder="sk-ant-api03-..." value="${esc(state.keyInput)}" style="border-radius:var(--rs)">
          <div style="display:flex;gap:8px">
            <button class="save-btn" style="flex:1;margin-top:0;background:var(--orange)" data-a="key-save">Saqlash</button>
            ${getApiKey()?`<button class="act-btn" style="flex:0;padding:0 16px;border-radius:var(--rs);border:none" data-a="key-cancel">Bekor</button>`:''}
          </div>
          <p style="font-size:11px;color:var(--text2)">🔒 Key faqat telefonda saqlanadi</p>
        </div>
      </div>`;
    }else{
      h+=`<div style="text-align:right"><button style="font-size:12px;color:var(--text2);background:none;border:none;font-weight:600" data-a="key-show"><i class="ti ti-key" style="font-size:12px"></i> API keyni yangilash</button></div>`;
    }

    h+=`<div class="ai-section su">
      <div class="ai-section-title"><i class="ti ti-brain" style="color:var(--acc)"></i>Xarajat tahlili</div>
      <button class="ai-action" data-a="ai-analyze" ${aiAnalysisLoading?'disabled':''}>
        ${aiAnalysisLoading?`<i class="ti ti-refresh spin"></i>Tahlil qilinmoqda...`:`<i class="ti ti-sparkles" style="color:var(--acc)"></i>AI tahlil qilsin`}
      </button>
      ${aiAnalysis?`<div class="ai-result">${esc(aiAnalysis)}</div>`:''}
    </div>`;

    h+=`<div class="ai-section su">
      <div class="ai-section-title"><i class="ti ti-scan" style="color:var(--green)"></i>Chek skaneri</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Kassa cheki yoki buyurtma rasmini oling</p>
      ${scanLoading?
        `<div class="ai-action"><i class="ti ti-refresh spin"></i>O'qilmoqda...</div>`:
        `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="ai-action" data-a="scan-camera"><i class="ti ti-camera" style="color:var(--acc)"></i>Kamera</button>
          <button class="ai-action" data-a="scan-gallery"><i class="ti ti-photo" style="color:var(--purple)"></i>Galereya</button>
        </div>`}
      ${scanItems?`<div style="margin-top:14px">
        <div class="group-toggle">
          <button class="group-opt${scanGrouped?' on':''}" data-a="scan-group" data-v="1">Bittada yig'indi</button>
          <button class="group-opt${!scanGrouped?' on':''}" data-a="scan-group" data-v="0">Alohida-alohida</button>
        </div>
        ${scanItems.map((item,i)=>`<div class="scan-item">
          <div class="scan-check${scanSelected.includes(i)?' on':''}" data-a="scan-toggle" data-v="${i}">
            ${scanSelected.includes(i)?'<i class="ti ti-check" style="font-size:12px;color:#fff"></i>':''}
          </div>
          <div class="scan-info">
            <div class="scan-name">${esc(item.name)}</div>
            <div class="scan-meta">${item.price!=null?item.price.toLocaleString('ru-RU')+' '+(item.currency||'EGP'):'—'} · ${(CATS[item.category]||CATS.other).l}</div>
          </div>
        </div>`).join('')}
        ${scanSelected.length?`<button class="scan-add" data-a="scan-add">
          <i class="ti ti-circle-check" style="font-size:16px"></i>
          ${scanGrouped?'Bittada qo\'shish':''+scanSelected.length+' ta qo\'shish'}
          ${scanGrouped?' (jami: '+(scanSelected.reduce((s,i)=>s+(scanItems[i]?.price||0),0)).toLocaleString('ru-RU')+' '+(scanItems[0]?.currency||'EGP')+')':''}
        </button>`:''}
      </div>`:''}
    </div>`;
  }

  // ══════════ ADD / EDIT FORM ══════════
  if(tab==='add'){
    const{aiChecking,aiConfirm,acSuggestions}=state;
    h+=`<div class="form-wrap su">
      <div class="form-header">
        <div class="form-title">${editItem?'Tahrirlash':'Yangi mahsulot'}</div>
        <button class="close-btn" data-a="cancel"><i class="ti ti-x"></i></button>
      </div>
      <div class="fg">
        <label class="fl-lbl">Mahsulot nomi *</label>
        <div class="ac-wrap">
          <input id="ninp" type="text" class="input-box" value="${esc(form.name)}" placeholder="Sut, Tuxum, Shampun..." autocomplete="off">
          <div id="ac-drop" class="ac-drop" style="display:${acSuggestions.length?'block':'none'}">
            ${acSuggestions.map(s=>`<div class="ac-item" data-a="ac-pick" data-v="${esc(s)}"><i class="ti ti-history"></i>${esc(s)}</div>`).join('')}
          </div>
        </div>
      </div>
      ${aiChecking?`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:14px;padding:10px 14px;background:var(--bg);border-radius:var(--rs)"><i class="ti ti-refresh spin"></i>AI tekshiryapti...</div>`:''}
      ${aiConfirm&&!aiConfirm.confirmed?`<div class="ai-confirm">
        <div class="ai-confirm-q">🤔 "${esc(aiConfirm.typed)}" — bu <b>"${esc(aiConfirm.suggested)}"</b> emasmi?</div>
        <div class="ai-confirm-acts">
          <button class="ai-yes" data-a="ai-yes">"${esc(aiConfirm.suggested)}" sifatida</button>
          <button class="ai-no" data-a="ai-no">Yo'q, yangi</button>
        </div>
      </div>`:''}
      <div class="fg">
        <label class="fl-lbl">Kategoriya</label>
        <div class="cat-grid">${Object.entries(CATS).map(([k,v])=>`<button class="cat-btn${form.category===k?' on':''}" data-a="cat" data-v="${k}"><i class="ti ${v.i}"></i>${v.l}</button>`).join('')}</div>
      </div>
      <div class="fg">
        <label class="fl-lbl">Narx (ixtiyoriy)</label>
        <input id="pinp" type="text" class="input-box" inputmode="decimal" value="${esc(form.price)}" placeholder="0">
      </div>
      <div class="fg">
        <label class="fl-lbl">Valyuta</label>
        <div class="cur-pills">${CURRENCIES.map(c=>`<button class="cur-pill${(form.currency||state.settings.defaultCurrency||'EGP')===c?' on':''}" data-a="cur-form" data-v="${c}">${c}</button>`).join('')}</div>
      </div>
      <div class="fg">
        <label class="fl-lbl">Holat</label>
        <div class="status-row">
          ${[{k:'need_to_buy',l:'Kerak',i:'ti-alert-circle'},{k:'in_cart',l:'Savatda',i:'ti-shopping-cart'},{k:'bought',l:'Olindi',i:'ti-circle-check'}].map(x=>`<button class="st-btn${form.status===x.k?' on':''}" data-a="st" data-v="${x.k}"><i class="ti ${x.i}"></i>${x.l}</button>`).join('')}
        </div>
      </div>
      <button class="save-btn" data-a="save" ${aiChecking?'disabled':''}>
        <i class="ti ${editItem?'ti-check':'ti-plus'}" style="font-size:16px"></i>
        ${aiChecking?'Tekshirilmoqda...':editItem?'Saqlash':'Qo\'shish'}
      </button>
    </div>`;
  }

  h+=`</div>`;
  app.innerHTML=h;
  if(tab==='add')setTimeout(()=>{const ni=$('ninp');if(ni)ni.focus();},80);
  if(tab==='stats'&&showBudgetEdit)setTimeout(()=>{const bi=$('binp');if(bi)bi.focus();},80);
}

function renderSetup(){
  app.innerHTML=`<div class="setup-wrap">
    <i class="ti ti-home" style="font-size:56px;display:block;margin-bottom:16px;opacity:.4"></i>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">Uy Inventori</h2>
    <p style="font-size:14px;color:var(--text2)">Firebase sozlanmagan</p>
  </div>`;
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/uy-inventori/sw.js').catch(()=>{});}
render();
</script>
</body>
</html>
