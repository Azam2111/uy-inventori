<!DOCTYPE html>
<html lang="uz" data-v="3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uy Inventori">

<title>Uy Inventori</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
:root{
  --bg:#f1f5f9;--card:#fff;--bd:rgba(0,0,0,0.09);--text:#1e293b;--muted:#64748b;--surface:#f8fafc;
  --rd-bg:#fef2f2;--rd-t:#dc2626;--rd-b:#fecaca;
  --am-bg:#fffbeb;--am-t:#d97706;--am-b:#fde68a;
  --gn-bg:#f0fdf4;--gn-t:#16a34a;--gn-b:#bbf7d0;
  --bl-bg:#eff6ff;--bl-t:#2563eb;--bl-b:#bfdbfe;
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f172a;--card:#1e293b;--bd:rgba(255,255,255,0.08);--text:#f1f5f9;--muted:#94a3b8;--surface:#1e293b;
  --rd-bg:#450a0a;--rd-t:#f87171;--rd-b:#7f1d1d;
  --am-bg:#451a03;--am-t:#fbbf24;--am-b:#78350f;
  --gn-bg:#052e16;--gn-t:#4ade80;--gn-b:#14532d;
  --bl-bg:#1e3a5f;--bl-t:#60a5fa;--bl-b:#1e40af;
}}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
button{cursor:pointer;font-family:inherit}
input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 14px;width:100%;font-size:16px;color:var(--text);font-family:inherit;outline:none;transition:.15s;-webkit-appearance:none}
input:focus{border-color:var(--muted)}
#app{max-width:430px;margin:0 auto;min-height:100vh}
/* HEADER */
.hdr{padding:14px 16px 0;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-title{font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hdr-sub.sync{color:var(--gn-t)}
.add-btn{display:flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--bd);border-radius:var(--rs);font-size:13px;color:var(--text);background:var(--surface)}
/* TABS */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;padding:8px 14px;font-size:13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:400;cursor:pointer;display:flex;align-items:center;gap:5px;border-radius:0;background:none;border-top:none;border-left:none;border-right:none;position:relative;white-space:nowrap}
.tb.on{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
.tb-badge{position:absolute;top:4px;right:6px;background:var(--rd-t);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}
/* CONTENT */
.cnt{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
/* CHIPS */
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{padding:10px 6px;border-radius:var(--rs);text-align:center;border:1px solid var(--bd);background:var(--surface);cursor:pointer}
.chip .cv{font-size:22px;font-weight:500;color:var(--text)}
.chip .cl{font-size:11px;color:var(--muted);margin-top:2px}
.chip.rd{border-color:var(--rd-b);background:var(--rd-bg)}.chip.rd .cv{color:var(--rd-t)}.chip.rd .cl{color:var(--rd-t)}
.chip.am{border-color:var(--am-b);background:var(--am-bg)}.chip.am .cv{color:var(--am-t)}.chip.am .cl{color:var(--am-t)}
.chip.gn{border-color:var(--gn-b);background:var(--gn-bg)}.chip.gn .cv{color:var(--gn-t)}.chip.gn .cl{color:var(--gn-t)}
/* PILLS */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--bd);color:var(--muted);cursor:pointer;background:none}
.pill.on{border-color:var(--text);color:var(--text);font-weight:500;background:var(--surface)}
/* ITEMS */
.items{display:flex;flex-direction:column;gap:8px}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ic.open{border-color:var(--muted)}
.ir{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ci{width:34px;height:34px;border-radius:var(--rs);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci i{font-size:17px;color:var(--muted)}
.ii{flex:1;min-width:0}
.iname{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isub{font-size:11px;color:var(--muted);margin-top:1px}
.iright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.bdg{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.bdg.rd{background:var(--rd-bg);color:var(--rd-t);border:1px solid var(--rd-b)}
.bdg.am{background:var(--am-bg);color:var(--am-t);border:1px solid var(--am-b)}
.bdg.gn{background:var(--gn-bg);color:var(--gn-t);border:1px solid var(--gn-b)}
.nbtn{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--text);font-weight:500;display:flex;align-items:center;gap:4px}
.exp{border-top:1px solid var(--bd);padding:11px 13px;background:var(--surface)}
.edates{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.eacts{display:flex;gap:7px}
.ab{flex:1;padding:7px;border-radius:var(--rs);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--bd);background:var(--card);color:var(--text)}
.ab.am-s{border-color:var(--am-b);background:var(--am-bg);color:var(--am-t)}
.ab.rd-s{border-color:var(--rd-b);background:var(--rd-bg);color:var(--rd-t);flex:0;padding:7px 11px}
.cycle-info{font-size:11px;color:var(--bl-t);background:var(--bl-bg);border:1px solid var(--bl-b);border-radius:6px;padding:5px 9px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty i{font-size:34px;display:block;margin-bottom:10px}
/* FLASH */
.fl{padding:10px 14px;border-radius:var(--rs);font-size:13px;font-weight:500}
.fl.ok{background:var(--gn-bg);color:var(--gn-t);border:1px solid var(--gn-b)}
.fl.err{background:var(--rd-bg);color:var(--rd-t);border:1px solid var(--rd-b)}
.fl.info{background:var(--bl-bg);color:var(--bl-t);border:1px solid var(--bl-b)}
/* FORM */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fl-lbl{font-size:12px;color:var(--muted)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:280px;overflow-y:auto}
.cbtn{padding:9px 12px;border-radius:var(--rs);border:1px solid var(--bd);background:none;font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px;cursor:pointer}
.cbtn.on{border-width:2px;border-color:var(--text);background:var(--surface);font-weight:500}
.sr{display:flex;gap:6px}
.sbtn{flex:1;padding:8px 4px;border-radius:var(--rs);border:1px solid var(--bd);background:none;font-size:11px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sbtn i{font-size:16px}
.sbtn.on{border-width:2px;border-color:var(--text);background:var(--surface);font-weight:500}
.sv-btn{padding:12px;border-radius:var(--rs);border:1px solid var(--bd);font-size:14px;font-weight:500;color:var(--text);width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:none;cursor:pointer;margin-top:4px}
.fhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.fhd h2{font-size:16px;font-weight:500}
.xbtn{padding:4px 8px;color:var(--muted);background:none;border:none;font-size:17px;cursor:pointer}
/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);margin-top:4px;z-index:100;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.ac-item{padding:10px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
.ac-item:active{background:var(--surface)}
.ai-check{padding:12px 14px;border-radius:var(--rs);background:var(--am-bg);border:1px solid var(--am-b);color:var(--am-t);font-size:13px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ai-check-q{font-weight:500;font-size:14px}
.ai-check-acts{display:flex;gap:8px}
.ai-yes{flex:1;padding:8px;border-radius:var(--rs);border:1px solid var(--am-b);background:var(--am-t);color:#fff;font-weight:500;font-size:13px}
.ai-no{flex:1;padding:8px;border-radius:var(--rs);border:1px solid var(--am-b);background:none;color:var(--am-t);font-weight:500;font-size:13px}
.ai-loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 0;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
/* STATS */
.sc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:12px}
.sk i{font-size:15px;color:var(--muted)}
.sk .n{font-size:22px;font-weight:500;margin:5px 0 2px}
.sk .l{font-size:12px;color:var(--muted)}
.cs h3{font-size:15px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.bi{margin-bottom:12px}
.bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bt{height:5px;background:var(--surface);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;background:var(--text);opacity:.6}
.bc{font-size:11px;color:var(--muted);margin-top:3px}
.tpr{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rnk{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
/* BUDGET */
.budget-bar{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.budget-fill{height:100%;border-radius:4px;transition:width .4s}
.budget-edit{display:flex;gap:8px;margin-top:10px}
.budget-edit input{flex:1}
.budget-save{padding:0 16px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--text);color:var(--card);font-size:13px;font-weight:500}
/* SMART NOTIFS */
.notif-list{display:flex;flex-direction:column;gap:6px}
.notif-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--card);border:1px solid var(--bd);border-radius:var(--rs)}
.notif-item.urgent{border-color:var(--rd-b);background:var(--rd-bg)}
.notif-item.warn{border-color:var(--am-b);background:var(--am-bg)}
.notif-icon{font-size:18px;flex-shrink:0}
.notif-text{flex:1;min-width:0}
.notif-name{font-weight:500;font-size:14px}
.notif-desc{font-size:11px;color:var(--muted);margin-top:1px}
.notif-add{padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);font-size:12px;font-weight:500;color:var(--text);flex-shrink:0}
/* QUICK ADD */
.qa-section{display:flex;flex-direction:column;gap:8px}
.qa-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px}
.qa-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qa-scroll::-webkit-scrollbar{display:none}
.qa-btn{flex-shrink:0;padding:8px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap}
.qa-btn i{font-size:13px;color:var(--muted)}
/* SHOP MODE */
.shop-items{display:flex;flex-direction:column;gap:10px}
.shop-item{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:20px;font-weight:500}
.shop-meta{font-size:13px;color:var(--muted);margin-top:3px}
.shop-done{width:52px;height:52px;border-radius:50%;border:2px solid var(--gn-b);background:var(--gn-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;color:var(--gn-t)}
.shop-total{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
/* AI TAB */
.ai-section{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-section h3{font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px}
.ai-action-btn{padding:11px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ai-result{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;background:var(--surface);border-radius:var(--rs);padding:12px;border:1px solid var(--bd)}
.scan-results{display:flex;flex-direction:column;gap:8px}
.scan-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface);border:1px solid var(--bd);border-radius:var(--rs)}
.scan-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.scan-check.on{border-color:var(--gn-t);background:var(--gn-t)}
.scan-name{flex:1;font-size:14px}
.scan-add-btn{padding:10px;border-radius:var(--rs);border:none;background:var(--gn-t);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
/* SETUP */
.setup{padding:20px 16px;max-width:430px;margin:0 auto}
.step{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.sn{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);font-size:11px;font-weight:500;align-items:center;justify-content:center;flex-shrink:0}
code{background:var(--surface);border:1px solid var(--bd);padding:2px 5px;border-radius:4px;font-size:12px}
.sl{color:#3b82f6}
</style>
</head>

<div id="app"></div>
<input type="file" id="cam-inp" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal-inp" accept="image/*" style="display:none">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ================================================
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDF9MoYhkiftBOSxcZ_4A2VVAQxx6lIzrY",
  authDomain:        "uy-inventori.firebaseapp.com",
  databaseURL:       "https://uy-inventori-default-rtdb.firebaseio.com",
  projectId:         "uy-inventori",
  storageBucket:     "uy-inventori.firebasestorage.app",
  messagingSenderId: "184996111777",
  appId:             "1:184996111777:web:109dd2394efd370bfcd7e0"
};
// API key localStorage da saqlanadi — kodda ko'rinmaydi
function getApiKey(){ return localStorage.getItem('claude_api_key')||''; }
function setApiKey(k){ localStorage.setItem('claude_api_key',k.trim()); }
const CLAUDE_API_KEY = 'USE_GETTER'; // placeholder
// ================================================

// ---- VALYUTA KURSLARI ----
let ratesCache = null, ratesFetched = 0;
async function getRates() {
  const now = Date.now();
  if (ratesCache && now - ratesFetched < 3600000) return ratesCache; // 1 soat kesh
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if (data.rates) { ratesCache = data.rates; ratesFetched = now; return data.rates; }
  } catch(e) {}
  // Fallback kurslar (taxminiy)
  return { UZS: 12800, EGP: 50.5, USD: 1, EUR: 0.92, AED: 3.67, RUB: 90 };
}
async function toUSD(amount, currency) {
  if (!amount) return 0;
  const rates = await getRates();
  const rate = rates[currency] || rates['UZS'] || 12800;
  return amount / rate;
}
function fmtUSD(usd) {
  if (!usd) return '$0.00';
  return '$' + usd.toFixed(2);
}


const CATS = {
  food:      { l:'Oziq-ovqat',    i:'ti-apple'          },
  hygiene:   { l:'Gigiyena',      i:'ti-droplet'         },
  household: { l:'Maishiy',       i:'ti-home'            },
  taxi:      { l:'Taxi/Avtobus',  i:'ti-car'             },
  education: { l:"Ta'lim",        i:'ti-school'          },
  sport:     { l:'Sport',         i:'ti-barbell'         },
  leisure:   { l:'Dam olish',     i:'ti-beach'           },
  food_out:  { l:'Tashqarida ovqat', i:'ti-tools-kitchen'},
  medicine:  { l:'Dori-darmon',   i:'ti-first-aid-kit'  },
  kids:      { l:'Bola uchun',    i:'ti-baby-carriage'  },
  other:     { l:'Boshqa',        i:'ti-package'         },
};
const SC = {
  need_to_buy:{ lbl:'Kerak',   cls:'rd', nl:'Savatga', ni:'ti-shopping-cart', ns:'in_cart' },
  in_cart:    { lbl:'Savatda', cls:'am', nl:'Olindi',  ni:'ti-circle-check',  ns:'bought'  },
  bought:     { lbl:'Olindi',  cls:'gn', nl:null,      ni:null,               ns:null      },
};
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const CONFIGURED = FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';

let db=null, dbRef=null;
let state = {
  items:[], settings:{ budget:null },
  tab:'list', filter:'all', open:null,
  editItem:null,
  form:{ name:'', category:'food', price:'', status:'need_to_buy' },
  flash:null, synced:false, loaded:!CONFIGURED,
  acSuggestions:[], aiChecking:false, aiConfirm:null,
  showKeySetup:!localStorage.getItem('claude_api_key'), keyInput:'',
  aiAnalysis:null, aiAnalysisLoading:false,
  scanLoading:false, scanItems:null, scanSelected:[],
  smartNotifs:[],
  showBudgetEdit:false,
  budgetInput:'',
};
let flashTimer=null;
const app=document.getElementById('app');

// ---- UTILS ----
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const curYM=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const mLbl=s=>{ const[y,m]=s.split('-'); return `${MONTHS[+m-1]} ${y}`; };
function fmtP(p, currency) {
  if (p == null || p === '') return null;
  const cur = currency || (state && state.settings && state.settings.defaultCurrency) || 'EGP';
  const symbols = { UZS: "so'm", EGP: 'EGP', USD: '$', EUR: '€', AED: 'AED', RUB: '₽' };
  const sym = symbols[cur] || cur;
  if (cur === 'USD') return '$' + Number(p).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return Number(p).toLocaleString('ru-RU') + ' ' + sym;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $id=id=>document.getElementById(id);
function upd(o,noRender){ Object.assign(state,o); if(!noRender)render(); }
function notify(msg,type){
  clearTimeout(flashTimer);
  upd({flash:{msg,type:type||'ok'}});
  flashTimer=setTimeout(()=>upd({flash:null}),2800);
}

// ---- FIREBASE ----
if(CONFIGURED){
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  dbRef=db.ref('inventory');
  let first=true;

// ---- SMART NOTIFICATIONS ----
function calculateCycle(name){
  const bought=state.items
    .filter(i=>i.name.toLowerCase()===name.toLowerCase()&&i.status==='bought'&&i.purchaseDate)
    .sort((a,b)=>new Date(a.purchaseDate)-new Date(b.purchaseDate));
  if(bought.length<2) return null;
  let total=0;
  for(let i=1;i<bought.length;i++)
    total+=(new Date(bought[i].purchaseDate)-new Date(bought[i-1].purchaseDate))/86400000;
  return Math.round(total/(bought.length-1));
}

function checkSmartNotifs(items){
  const names=[...new Set(items.filter(i=>i.status==='bought').map(i=>i.name))];
  const notifs=[];
  names.forEach(name=>{
    const cycle=calculateCycle(name);
    if(!cycle) return;
    const lastBought=items.filter(i=>i.name===name&&i.status==='bought'&&i.purchaseDate)
      .sort((a,b)=>new Date(b.purchaseDate)-new Date(a.purchaseDate))[0];
    if(!lastBought) return;
    const daysSince=Math.round((Date.now()-new Date(lastBought.purchaseDate))/86400000);
    const alreadyActive=items.some(i=>i.name===name&&(i.status==='need_to_buy'||i.status==='in_cart'));
    if(daysSince>=Math.round(cycle*0.75)&&!alreadyActive){
      notifs.push({name,daysSince,cycle,urgent:daysSince>=cycle});
    }
  });
  const sorted=notifs.sort((a,b)=>b.daysSince-a.daysSince);
  upd({smartNotifs:sorted},true);
  // Browser notification
  if(sorted.length&&Notification.permission==='granted'){
    const urgent=sorted.filter(n=>n.urgent);
    if(urgent.length){
      new Notification('Uy Inventori 🏠',{
        body:urgent.slice(0,3).map(n=>`${n.name} (${n.daysSince} kun)`).join(', ')+' tugayapti!',
        tag:'smart-notif'
      });
    }
  }
}

}

async function aiNormalize(typedName){

Faqat JSON array: [{"name":"Tovuq go'shti","price":274.95,"currency":"EGP","date":"\${today}","category":"food"}]`}","date":"\${today}"}]`}

function handleImageFile(file){
  if(!file) return;
  upd({tab:'ai',scanLoading:true,scanItems:null,scanSelected:[]});
  // Compress image before sending
  const img=new Image();
  const objUrl=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(objUrl);
    const MAX=1200;
    let w=img.width,h=img.height;
    if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    const base64=canvas.toDataURL('image/jpeg',0.85).split(',')[1];
    scanReceipt(base64,'image/jpeg');
  };
  img.onerror=()=>{ notify("Rasmni o'qib bo'lmadi",'err'); upd({scanLoading:false}); };
  img.src=objUrl;
}

      <div class="ac-wrap">
        <input id="ninp" type="text" value="${esc(form.name)}" placeholder="Sut, Shampun, Limon..." autocomplete="off">
        <div id="ac-drop" class="ac-drop" style="display:${acSuggestions.length?'block':'none'}">
          ${acSuggestions.map(s=>`<div class="ac-item" data-a="ac-pick" data-v="${esc(s)}"><i class="ti ti-history"></i>${esc(s)}</div>`).join('')}
        </div>
      </div>
    </div>`;
    if(aiChecking) h+=`<div class="ai-loading"><i class="ti ti-refresh spin" style="font-size:15px"></i>AI tekshiryapti...</div>`;
    if(aiConfirm&&!aiConfirm.confirmed){
      h+=`<div class="ai-check">
        <div class="ai-check-q">🤔 "${esc(aiConfirm.typed)}" &mdash; bu <b>"${esc(aiConfirm.suggested)}"</b> emasmi?</div>
        <div class="ai-check-acts">
          <button class="ai-yes" data-a="ai-yes">"${esc(aiConfirm.suggested)}" sifatida</button>
          <button class="ai-no" data-a="ai-no">Yo&#39;q, yangi</button>
        </div>
      </div>`;
    }
    h+=`
    <div class="fg">
      <label class="fl-lbl">Kategoriya</label>
      <div class="cg">
        ${Object.entries(CATS).map(([k,v])=>`<button class="cbtn${form.category===k?' on':''}" data-a="cat" data-v="${k}"><i class="ti ${v.i}" style="font-size:15px"></i>${v.l}</button>`).join('')}
      </div>
    </div>
    <div class="fg">
      <label class="fl-lbl">Narx (ixtiyoriy)</label>
      <input id="pinp" type="text" inputmode="numeric" value="${esc(form.price)}" placeholder="0">
      <div id="pprev" style="font-size:12px;color:var(--muted);margin-top:4px;min-height:16px">${form.price?fmtP(+form.price)||'':''}</div>
    </div>
    <div class="fg">
      <label class="fl-lbl">Status</label>
      <div class="sr">
        ${[{k:'need_to_buy',l:'Kerak',i:'ti-alert-circle'},{k:'in_cart',l:'Savatda',i:'ti-shopping-cart'},{k:'bought',l:'Olindi',i:'ti-circle-check'}].map(x=>`<button class="sbtn${form.status===x.k?' on':''}" data-a="st" data-v="${x.k}"><i class="ti ${x.i}"></i>${x.l}</button>`).join('')}
      </div>
    </div>
    <button class="sv-btn" data-a="save" ${aiChecking?'disabled style="opacity:.5"':''}>
      <i class="ti ${editItem?'ti-check':'ti-plus'}" style="font-size:15px"></i>
      ${aiChecking?'Tekshirilmoqda...':editItem?'Saqlash':'Qo&#39;shish'}
    </button>`;
  }

  h+=`</div>`;
  app.innerHTML=h;

  if(tab==='add') setTimeout(()=>{const ni=$id('ninp');if(ni)ni.focus();},80);
  if(tab==='stats'){
    // Calculate USD total async
    const statsItems = state.items.filter(i=>i.status==='bought'&&i.month===curYM()&&i.price);
    if(statsItems.length){
      Promise.all(statsItems.map(i=>toUSD(i.price,i.currency||'UZS'))).then(vals=>{
        const total = vals.reduce((s,v)=>s+v,0);
        const el = $id('usd-total-val');
        if(el) el.textContent = fmtUSD(total);
      });
    } else {
      setTimeout(()=>{ const el=$id('usd-total-val'); if(el) el.textContent='—'; },0);
    }
  }
  if(tab==='stats'&&showBudgetEdit) setTimeout(()=>{const bi=$id('binp');if(bi)bi.focus();},80);
}

// ---- SETUP ----
function renderSetup(){
  app.innerHTML=`<div class="setup">
    <div style="text-align:center;margin-bottom:24px">
      <i class="ti ti-home" style="font-size:40px;display:block;margin-bottom:10px"></i>
      <h2 style="font-size:18px;font-weight:500;margin-bottom:6px">Uy Inventori</h2>
      <p style="font-size:13px;color:var(--muted)">Firebase sozlanmagan</p>
    </div></div>`;
}

// ---- SERVICE WORKER ----
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/uy-inventori/sw.js').catch(()=>{});
}

render();
</script>
